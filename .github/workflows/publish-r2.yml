name: Publish Mac downloads to R2

on:
  push:
    branches: [main]
    paths: [appcast.xml]
  workflow_dispatch:
    inputs:
      publish:
        description: Update the public appcast and website latest installer after verification
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: production-mac-downloads
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish and verify the signed installer
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: willow-downloads
          R2_PUBLIC_URL: https://downloads.willowvoice.com
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish }}
        run: bash scripts/publish-r2.sh
